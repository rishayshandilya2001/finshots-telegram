name: Send Finshots Daily to Telegram

on:
  schedule:
    # 2:30 UTC = 8:00 AM IST. Cron always runs in UTC, so this is the IST offset applied.
    - cron: "30 2 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test anytime

# Needed so the workflow can commit sent_log.txt back to the repo
permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_finshots.py

      # Saves which post was sent, so a re-run today doesn't duplicate-send.
      - name: Commit updated sent log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_log.txt
          git diff --cached --quiet || git commit -m "Update sent log"
          git push
